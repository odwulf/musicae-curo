[project]
name = "tidal-cli"
version = "0.1.0"
description = "Schedulable Tidal CLI client for playlist management and automated daily discovery mixes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tidalapi>=0.7.5",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
tidal-cli = "tidal_cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tidal_cli"]
