[project]
name = "musicae-curo"
version = "0.1.0"
description = "Universal music library custodian, playlist protector, and daily discovery mix archiver"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tidalapi>=0.7.5",
    "spotipy>=2.24.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
curo = "curo.cli:app"

[project.urls]
Repository = "https://github.com/odwulf/musicae-curo"
Issues = "https://github.com/odwulf/musicae-curo/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curo"]
